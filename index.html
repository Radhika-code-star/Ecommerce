<!DOCTYPE html>
<html>

<head>
    <title>Simple E-Commerce</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Products</h1>

    <a href="/cart">View Cart</a>

    <ul>
        {% for product in products %}
        <li>
            {{ product.name }} - ₹{{ product.price }}
            <a href="/add/{{ product.id }}">Add to Cart</a>
        </li>
        {% endfor %}
    </ul>

</body>

</html>
